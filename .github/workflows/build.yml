name: Build

on:
  push:

jobs:
  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_name: linux-x86_64

          - os_name: linux
            arch: arm64
            runner: ubuntu-latest
            artifact_name: linux-arm64

          - os_name: windows
            arch: x64
            runner: windows-latest
            artifact_name: windows-x64.exe

          - os_name: windows
            arch: arm64
            runner: windows-latest
            artifact_name: windows-arm64.exe

          - os_name: macos
            arch: x86_64
            runner: macos-13
            deployment_target: '10.13'
            artifact_name: macos-x86_64

          - os_name: macos
            arch: arm64
            runner: macos-14
            deployment_target: '11.0'
            artifact_name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install tools
        if: matrix.os_name == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Linux (cisc)
        if: matrix.os_name == 'linux' && matrix.arch == 'x86_64'
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cp binary ../${{ matrix.artifact_name }}

      - name: Build Linux (risc)
        if: matrix.os_name == 'linux' && matrix.arch == 'arm64'
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          make -j$(nproc)
          cp binary ../${{ matrix.artifact_name }}

      - name: Setup dev cmd
        if: matrix.os_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build Windows (${{ matrix.arch }})
        if: matrix.os_name == 'windows'
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" ..
          nmake
          copy binary.exe ..\${{ matrix.artifact_name }}

      - name: Build macOS (${{ matrix.arch }})
        if: matrix.os_name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"
          make -j$(sysctl -n hw.ncpu)
          cp binary ../${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}